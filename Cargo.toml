[package]
name = "mtc-lake-verifier"
version = "0.1.0"
edition = "2021"
description = "Verifier core for Merkle Tree Certificates landmarks/inclusion proofs, prototyping draft-kwiatkowski-mtc-iot"

[dependencies]
sha2 = "0.10.8"
p256 = { version = "0.13.2", features = ["ecdsa"] }
ecdsa = "0.16.9"
ed25519-dalek = "2.1.1"

[dev-dependencies]
hex = "0.4.3"
rand = "0.8.5"
